[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-sdk"
version = "0.2.1"
description = "Python SDK for Polymarket - prediction markets trading, smart money analysis, and market data"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Catalyst Team", email = "team@catalyst.fun"}
]
keywords = [
    "polymarket",
    "prediction-markets",
    "trading",
    "crypto",
    "defi",
    "smart-money"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "aiohttp>=3.8.0",
    "web3>=6.0.0",
    "eth-account>=0.8.0",
    "eth-utils>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "pylint>=2.17.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/catalyst-team/poly-sdk"
Documentation = "https://github.com/catalyst-team/poly-sdk#readme"
Repository = "https://github.com/catalyst-team/poly-sdk"
